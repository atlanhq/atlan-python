[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyatlan"
dynamic = ["version"]
description = "Atlan Python Client"
readme = "README.md"
license = {text = "Apache LICENSE 2.0"}
authors = [
    {name = "Atlan Technologies Pvt Ltd", email = "engineering@atlan.com"}
]
maintainers = [
    {name = "Atlan Technologies Pvt Ltd", email = "engineering@atlan.com"}
]
keywords = ["atlan", "client"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic~=2.13.4",
    "jinja2~=3.1.6",
    "tenacity~=9.1.4",
    "lazy-loader~=0.5",
    "nanoid~=2.0.0",
    "pytz~=2026.2",
    "python-dateutil~=2.9.0.post0",
    "PyYAML~=6.0.3",
    # httpx 0.28.1 is the latest stable (1.0 is still dev-only).
    "httpx~=0.28.1",
    "httpx-retries~=0.6.0",
    "authlib~=1.7.2",
    "msgspec~=0.21.1",
]

[project.urls]
Homepage = "https://github.com/atlanhq/atlan-python"
Repository = "https://github.com/atlanhq/atlan-python"
Documentation = "https://github.com/atlanhq/atlan-python"
Issues = "https://github.com/atlanhq/atlan-python/issues"

[project.scripts]
# Regenerate the native (v3) app builders + their tests from the tenant's UI
# configmaps. Needs ATLAN_BASE_URL + ATLAN_API_KEY in the environment.
generate-apps = "pyatlan.generator.generate_apps:main"

[dependency-groups]
dev = [
    "mypy~=2.3.0",
    "ruff~=0.15.22",
    "types-setuptools~=83.0.0.20260716",
    "types-Authlib~=1.6.11.20260518",
    "jaraco-context~=6.1.0",
    "filelock~=3.32.0",
    "virtualenv~=21.7.0",
    "urllib3~=2.7.0",
    "pytest~=9.1.1",
    "pytest-vcr~=1.0.2",
    "vcrpy~=8.3.0",
    "pytest-order~=1.5.0",
    "pytest-timer[termcolor]~=1.0.0",
    "pytest-sugar~=1.1.1",
    "pre-commit~=4.6.0",
    "deepdiff~=9.1.0",
    "pytest-cov~=7.1.0",
    "twine~=6.2.0",
    "types-retry~=0.9.9.20250322",
    # networkx 3.6 requires py3.11, so Python 3.10 keeps the older pin.
    "networkx~=3.2.1; python_version < '3.11'",
    "networkx~=3.6.1; python_version >= '3.11'",
    "networkx-stubs~=0.0.1",
    "pytest-asyncio~=1.4.0",
]

docs = [
    "mkdocs~=1.6.1",
    "mkdocs-material~=9.7.7",
    # mkdocstrings 1.x is a major (config-format changes) and the docs build is
    # not exercised by unit tests — bump separately with a verified docs build.
    "mkdocstrings[python]~=0.29.1",
    "pydantic~=2.13.4",
    "jinja2~=3.1.6",
    "networkx~=3.2.1; python_version < '3.11'",
    "networkx~=3.6.1; python_version >= '3.11'",
    "tenacity~=9.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyatlan*"]

[tool.setuptools.package-data]
pyatlan = ["py.typed", "logging.conf"]
"*" = ["*.jinja2"]

[tool.setuptools.dynamic]
version = {file = "pyatlan/version.txt"}

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff]
fix = true
line-length = 88
exclude = ["env", "venv", "__pycache__", "pyatlan_v9/model/assets/_overlays"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"pyatlan/model/assets.py" = ["S307"]
"pyatlan/model/assets/**.py" = ["E402", "F811"]
"pyatlan/model/assets/core/**.py" = ["E402", "F811"]
"pyatlan_v9/model/assets/**.py" = ["E402", "F821"]
"pyatlan_v9/model/transform.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-p no:name_of_plugin"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "module"
asyncio_default_fixture_loop_scope = "module"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
environments = ["python_version >= '3.10' and python_version < '3.15' and platform_python_implementation == 'CPython'"]
constraint-dependencies = ["cryptography>=50.0.0"]

# Pin PyPI as the project index so uv.lock records pypi.org URLs, not the
# machine-wide Endor firewall proxy (factory.endorlabs.com) that laptops default
# to. A project-level index takes precedence over the machine default for every
# uv command (lock/sync/add/...), which keeps the committed lockfile portable --
# otherwise CI, which has no laptop proxy credentials, 401s on the proxy URLs.
# Per the Security team's rollout guidance (2026-09-11); Endor still scans deps
# via the GitHub dependency check, not the index.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.poe.tasks]
snyk-requirements = "uv export --all-extras --no-hashes > snyk-requirements.txt"
